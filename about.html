<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Daisha Overstreet</title>
  <link rel="icon" type="image/png" href="images/by Daisha favicon.png" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav style="background: rgba(253, 253, 253, 0.95); border-bottom: 1px solid #000000; padding: 1rem 2rem; display: flex; justify-content: center; gap: 2rem;  margin-bottom: 3rem;">
    <a href="index.html" style="color: #000000; text-decoration: none; font-weight: 500; transition: color 0.3s ease;">Home</a>
    <a href="about.html" style="color: #000000; text-decoration: none; font-weight: 500; transition: color 0.3s ease; border-bottom: 2px solid #000000;">About</a>
    <a href="projects.html" style="color: #000000; text-decoration: none; font-weight: 500; transition: color 0.3s ease;">Projects</a>
  </nav>

  <main>
    <!-- Animated Profile Section -->
    <section style="width: 100%; min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;">
      <div style="position: relative; width: 100%; max-width: 800px;">
        <div style="width: 100%; overflow: hidden; border: 1px solid #000000;">
          <img id="slideshow" style="width: 100%; height: auto; display: block;" />
          <!-- Saturation/Contrast Overlay -->
          <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; filter: saturate(125%) contrast(120%) brightness(1.15) hue-rotate(2deg);"></div>
        </div>
      </div>
      
      <div style="max-width: 800px; margin-top: 2rem; text-align: center;">
        <h1 style="margin: 0 0 1rem 0; font-size: 2.5rem; font-weight: 400;">Daisha Overstreet</h1>
        <p style="margin: 0; font-size: 1.1rem; line-height: 1.6; color: #333;">Designer driven by curiosity, craft, and a long-running love affair with making things tangible. Her work moves between fashion and the web, where silhouettes meet systems and materials meet interfaces.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer style="text-align: center; padding: 1rem; color: rgba(0, 0, 0, 0.6);">
      <p style="margin: 0; font-size: 0.9rem;">© <span id="year"></span> thoughtful work, in progress by Daisha</p>
    </footer>
  </main>

  <script>
    // Update year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Slideshow animation
    const slideshow = document.getElementById('slideshow');
    const images = [
      'images/ProfileSlide1.png',
      'images/ProfileSlide2.png',
      'images/ProfileSlide3.png',
      'images/ProfileSlide4.png',
      'images/ProfileSlide5.png',
      'images/ProfileSlide6.png',
      'images/ProfileSlide7.png',
      'images/ProfileSlide8.png',
      'images/ProfileSlide9.png',
      'images/ProfileSlide10.png',
      'images/ProfileSlide11.png'
    ];
    
    let currentIndex = 0;
    let direction = 1; // 1 for forward, -1 for backward
    
    function updateSlide() {
      slideshow.src = images[currentIndex];
      
      // Move to next slide
      currentIndex += direction;
      
      // Reverse direction at the ends
      if (currentIndex >= images.length - 1) {
        direction = -1;
      } else if (currentIndex <= 0) {
        direction = 1;
      }
    }
    
    // Initialize with first image
    updateSlide();
    
    // Change slide every 1 second
    setInterval(updateSlide, 1000);
  </script>
</body>
</html>
