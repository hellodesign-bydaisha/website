      margin-top: 1rem;

    }

      background: #000000;

    }

    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      overflow: hidden;
    }

    .carousel-images {
      display: flex;
      transition: transform 0.3s ease;
      scroll-snap-type: x mandatory;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-images::-webkit-scrollbar {
      display: none;
    }

    .carousel-slide {
      flex: 0 0 100%;

    }

    .carousel-slide img {

      max-height: 70vh;
      object-fit: contain;
      display: block;
      
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      min-width: 10px;
      min-height: 10px;
      padding: 0;
      
      background: #cccccc;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }

    .carousel-dot.active {
      background: #000000;
    }

    .project-nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin: 3rem 0 0;
      padding: 0;

    .project-nav-btn {
      padding: 0.75rem 1.5rem;

    .image-section img {

    .image-grid {

      gap: 1.5rem;

    .mobile-grid {

      gap: 1.5rem;

    @media (max-width: 768px) {

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;

      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;

    }

    @media (max-width: 768px) {

        padding: 1rem;
      }

      }

      .project-header p {

      }

      .image-grid {

      }

  <script src="../script.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script>
    const carouselImages = document.getElementById('carouselImages');
    const carouselDots = document.getElementById('carouselDots');
    const slides = carouselImages.querySelectorAll('.carousel-slide');
    
    // Create dots
    slides.forEach((_, index) => {
      const dot = document.createElement('button');
      dot.classList.add('carousel-dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => {
        carouselImages.scrollLeft = slides[index].offsetLeft;
      });
      carouselDots.appendChild(dot);
    });
    
    // Update active dot on scroll
    carouselImages.addEventListener('scroll', () => {
      const scrollLeft = carouselImages.scrollLeft;
      const slideWidth = slides[0].offsetWidth;
      const activeIndex = Math.round(scrollLeft / slideWidth);
      
      document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
        dot.classList.toggle('active', index === activeIndex);
      });
    });
  </script>
</body>
