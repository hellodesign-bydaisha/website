<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>By Daisha</title>
    <link rel="icon" type="image/png" href="images/by Daisha favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body style="background: #ffffff;">

    <main>
      <!-- Hero Section -->
      <section class="hero-section" style="width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem;">
        <div style="max-width: 800px; text-align: center;">
          <h1 style="margin: 0 0 1rem 0; font-size: 3.5rem; font-weight: 400;">Daisha Overstreet</h1>
          <p style="margin: 0 0 3rem 0; font-size: 1.2rem; line-height: 1.6; color: #333;">Designer driven by curiosity, craft, and a long-running love affair with making things tangible.</p>
          
          <div style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
            <a href="about.html" style="display: inline-block; padding: 0.75rem 2rem; background: #000000; color: #ffffff; text-decoration: none; font-weight: 500; transition: all 0.3s ease; border: 2px solid #000000;">About</a>
            <a href="projects.html" class="projects-btn" style="display: inline-block; padding: 0.75rem 2rem; background: #000000; color: #ffffff; text-decoration: none; font-weight: 500; transition: all 0.3s ease; border: 2px solid #000000;">View Projects</a>
          </div>
        </div>

        <!-- Footer -->
        <footer style="position: absolute; bottom: 2rem; text-align: center; color: rgba(0, 0, 0, 0.6);">
          <p style="margin: 0; font-size: 0.9rem;">© <span id="year"></span> thoughtful work, in progress by Daisha</p>
        </footer>
      </section>
    </main>

    <script>
      // Update year
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
