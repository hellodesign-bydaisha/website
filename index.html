<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>By Daisha</title>
    <link rel="icon" type="image/png" href="images/by Daisha favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body style="background: url('images/home background.jpg') no-repeat center center fixed; background-size: cover;">

    <main style="animation: fadeIn 1.5s ease-out;">
      <!-- Hero Section -->
      <section class="hero-section" style="width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; background: transparent;">
        <div style="max-width: 600px; text-align: center; background: #fdfdfd; border: 2px solid #110b09; padding: 3rem;">
          <h1 style="margin: 0 0 1rem 0; font-size: 3.5rem; font-weight: 400;">Design driven by curiosity and craft.</h1>
          <p class="hero-description" style="font-size: 1.2rem; line-height: 1.6; color: #333;">Explore a visual diary of fashion, interfaces, and intentional creations made for those who value quiet playfulness.</p>
          
          <div class="button-container" style="margin-top: 1.5rem;">
            <a href="projects.html" class="projects-btn" style="display: inline-block; padding: 0.75rem 2rem; background: #110b09; color: #fdfdfd; text-decoration: none; font-weight: 500; transition: all 0.3s ease; border: 2px solid #110b09;">Enter Portfolio</a>
          </div>
        </div>

        <!-- Footer -->
        <footer style="position: absolute; bottom: 2rem; text-align: center; color: rgba(0, 0, 0, 0.6);">
          <p style="margin: 0; font-size: 0.9rem;">© <span id="year"></span> thoughtful work, in progress by Daisha</p>
        </footer>
      </section>
    </main>

    <script>
      // Update year
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
